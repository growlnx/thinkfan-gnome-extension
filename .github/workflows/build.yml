name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          sh -n script/thinkfan-set
          sh -n deb/thinkfan-gnome-extension/DEBIAN/postinst

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n 's/^Version: //p' deb/thinkfan-gnome-extension/DEBIAN/control)
          [ "v$ver" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != control Version $ver"; exit 1; }

      - name: Build .deb
        run: make deb

      - name: Show package contents
        run: |
          dpkg-deb -I build/*.deb
          dpkg-deb -c build/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
